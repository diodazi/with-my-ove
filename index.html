<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>CRX和LJW的正经抽奖 | 要怎么变得舒服</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #fef5f7 0%, #ffe8ed 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, 'Noto Sans', sans-serif;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255,245,247,0.85);
            backdrop-filter: blur(2px);
            border-radius: 2.5rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .main-panel {
            background: #ffffff;
            border-radius: 2rem;
            margin: 0.75rem;
            padding: 1.8rem 1.5rem 2rem 1.5rem;
        }

        .sync-status {
            background: #fff0f3;
            border-radius: 2rem;
            padding: 0.5rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.75rem;
            color: #b34e6e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .sync-badge {
            background: #b34e6e;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
        }

        .sync-btn {
            background: none;
            border: 1px solid #b34e6e;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.7rem;
            color: #b34e6e;
        }

        .brand h1 {
            font-size: 1.9rem;
            font-weight: 650;
            background: linear-gradient(135deg, #C44B6C, #A83255);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-align: center;
        }

        .brand p {
            text-align: center;
            color: #c2748c;
            font-size: 1rem;
            margin-top: 0.3rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* 分区标签栏 */
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cat-btn {
            background: #fef0f4;
            border: 1px solid #f1cfda;
            padding: 0.6rem 0.8rem;
            border-radius: 2.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #b6496c;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            min-width: 105px;
        }

        .cat-btn.active {
            background: #e46b8d;
            border-color: #e46b8d;
            color: white;
            box-shadow: 0 2px 8px rgba(228, 107, 141, 0.3);
        }

        .cat-btn:active {
            transform: scale(0.96);
        }

        .draw-area {
            background: #fff9fb;
            border-radius: 2rem;
            padding: 2rem 1rem;
            margin-bottom: 2rem;
            text-align: center;
            border: 1px solid #ffe2ea;
            box-shadow: 0 6px 14px rgba(192, 72, 102, 0.08);
        }

        .current-category-badge {
            font-size: 0.85rem;
            color: #c2748c;
            background: #fff0f4;
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            margin-bottom: 0.8rem;
            font-weight: 500;
        }

        .result-label {
            font-size: 1rem;
            font-weight: 500;
            color: #c95c7c;
            margin-bottom: 1rem;
            min-height: 3rem;
            font-style: italic;
        }

        .result-word {
            font-size: 2.5rem;
            font-weight: 700;
            color: #9e3e5c;
            word-break: break-word;
            min-height: 5rem;
        }

        .draw-btn {
            background: #e46b8d;
            border: none;
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 0.9rem 2rem;
            border-radius: 3rem;
            cursor: pointer;
            margin-top: 0.8rem;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(200, 80, 110, 0.3);
            letter-spacing: 2px;
        }

        .draw-btn:active {
            transform: scale(0.96);
            background: #c75478;
        }

        .manager-section {
            margin-top: 1rem;
            border-top: 1px solid #ffe2ea;
            padding-top: 1.8rem;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-title h3 {
            font-weight: 600;
            font-size: 1.25rem;
            color: #b3486a;
        }

        .badge-count {
            background: #ffeef3;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #b6496c;
        }

        .view-rewards-btn {
            background: #fce4eb;
            border: 1px solid #e6b7c6;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #b6496c;
            cursor: pointer;
            transition: 0.1s;
        }

        .view-rewards-btn:active {
            background: #f5d0db;
        }

        .add-form {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .add-form input {
            flex: 2;
            padding: 0.85rem 1rem;
            border: 1px solid #f0ccd8;
            border-radius: 2rem;
            font-size: 0.95rem;
            background: white;
            transition: 0.2s;
        }

        .add-form input:focus {
            outline: none;
            border-color: #e085a2;
            box-shadow: 0 0 0 3px rgba(228, 107, 141, 0.2);
        }

        .category-select {
            flex: 1;
            padding: 0.85rem 1rem;
            border: 1px solid #f0ccd8;
            border-radius: 2rem;
            font-size: 0.9rem;
            background: white;
            color: #b6496c;
            font-weight: 500;
            cursor: pointer;
        }

        .add-form button {
            background: #fef0f4;
            border: none;
            padding: 0 1.4rem;
            border-radius: 2.5rem;
            font-weight: 600;
            color: #b6496c;
            cursor: pointer;
            border: 1px solid #f1cfda;
        }

        .entries-list {
            background: #ffffff;
            border-radius: 1.5rem;
            border: 1px solid #ffe2ea;
            max-height: 380px;
            overflow-y: auto;
            transition: 0.2s;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #ffeef3;
        }

        .item-text {
            flex: 1;
            word-break: break-word;
            color: #694150;
            font-weight: 500;
        }

        .item-actions {
            display: flex;
            gap: 12px;
        }

        .edit-btn, .del-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 6px;
            border-radius: 30px;
        }

        .edit-btn {
            color: #b68696;
        }

        .del-btn.disabled-delete {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .empty-message {
            text-align: center;
            padding: 2.8rem 1rem;
            color: #cb8ba2;
        }

        .blur-content {
            filter: blur(5px);
            user-select: none;
            pointer-events: none;
        }

        .protected-area {
            transition: all 0.2s;
        }

        @keyframes gentlePop {
            0% { transform: scale(0.98); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-word {
            animation: gentlePop 0.2s ease-out;
        }

        @media (max-width: 550px) {
            body { padding: 0.8rem; }
            .result-word { font-size: 1.8rem; }
            .draw-btn { font-size: 1.2rem; padding: 0.7rem 1.5rem; }
            .cat-btn { font-size: 0.7rem; padding: 0.5rem 0.5rem; min-width: 80px; }
        }

        .footnote {
            margin-top: 1rem;
            font-size: 0.7rem;
            text-align: center;
            color: #c593a8;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="main-panel">
        <div class="sync-status">
            <span>🔄 多端实时同步 · 三分区奖池</span>
            <span class="sync-badge" id="syncStatusBadge">已连接</span>
            <button class="sync-btn" id="manualSyncBtn">手动同步</button>
        </div>

        <div class="brand">
            <h1>🎁 CRX和LJW的正经抽奖</h1>
            <p>今天，要怎么♥</p>
        </div>

        <!-- 三个分区切换按钮 -->
        <div class="category-tabs">
            <button class="cat-btn active" data-cat="costume">🎭 今天要不要扮成……</button>
            <button class="cat-btn" data-cat="action">✨ 今天要不要这样做……</button>
            <button class="cat-btn" data-cat="place">📍 今天要不要在这里……</button>
        </div>

        <div class="draw-area">
            <div class="current-category-badge" id="currentCatDisplay">🎭 当前奖池：扮成……</div>
            <div class="result-label" id="randomHintLabel">🎲 骚母猪抽到要大声念出来哦</div>
            <div class="result-word" id="resultDisplay">❤ 要怎么做呢</div>
            <button class="draw-btn" id="drawBtn">LOVE</button>
        </div>

        <div class="manager-section">
            <div class="section-title">
                <h3> ♥有什么想做的就放♀进来哦♥</h3>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span class="badge-count" id="entriesCount">0 项</span>
                    <button class="view-rewards-btn" id="viewRewardsBtn">❤ 查看全部奖励</button>
                </div>
            </div>

            <div class="add-form">
                <select id="categorySelect" class="category-select">
                    <option value="costume">🎭 今天扮成……</option>
                    <option value="action">✨ 今天这样做……</option>
                    <option value="place">📍 今天在这里……</option>
                </select>
                <input type="text" id="newEntryInput" placeholder="增加新的奖励/选项" autocomplete="off" />
                <button id="addEntryBtn">＋ 增添</button>
            </div>

            <div id="entriesListContainer" class="entries-list protected-area">
                <div class="empty-message">🔒 奖励列表已隐藏，点击【查看全部奖励】并输入密码可见详情及管理</div>
            </div>
            <div class="footnote">
                小狗狗一个人别想偷偷看都有什么被存进来了呢。
            </div>
        </div>
    </div>
</div>

<script>
    // ---------- API 配置 --------------
    const API_BASE = window.location.origin;
    
    // ---------- 多分区数据结构 (三个独立奖池) ----------
    let categoriesData = {
        costume: [],   // 存储 { id, text }
        action: [],
        place: []
    };
    let currentVersion = 0;
    let currentCategory = 'costume';  // 当前选中的分区: costume, action, place
    let syncTimer = null;
    
    // UI 权限状态 : 是否解锁查看模式 (密码正确)
    let isUnlocked = false;     
    
    // 随机标语池 (每次打开/刷新随机展示)
    const hintMessages = [
       "骚母狗抽到要大声念出来哦",
        "高潮的时候记得说要去了",
        "对daddy说我是属于你的母猪才可以抽奖励哦",
        "是要先抽奖励还是先被daddy抽插啊",
        "用舌头点屏幕",
        "把手指沾满笨蛋小穴里的汁液再点屏幕",
        "一只手抓住主人的肉棒，用肉棒点屏幕"
    ];

    // DOM 元素
    const resultDisplayEl = document.getElementById('resultDisplay');
    const drawBtn = document.getElementById('drawBtn');
    const entriesListContainer = document.getElementById('entriesListContainer');
    const newEntryInput = document.getElementById('newEntryInput');
    const addEntryBtn = document.getElementById('addEntryBtn');
    const entriesCountSpan = document.getElementById('entriesCount');
    const syncStatusBadge = document.getElementById('syncStatusBadge');
    const manualSyncBtn = document.getElementById('manualSyncBtn');
    const viewRewardsBtn = document.getElementById('viewRewardsBtn');
    const randomHintLabel = document.getElementById('randomHintLabel');
    const currentCatDisplay = document.getElementById('currentCatDisplay');
    const categorySelect = document.getElementById('categorySelect');

    // 页面加载时随机选择一句提示
    function setRandomHint() {
        const randomIndex = Math.floor(Math.random() * hintMessages.length);
        randomHintLabel.innerText = hintMessages[randomIndex];
    }
    setRandomHint();

    // 同步状态显示
    function updateSyncStatus(connected) {
        if (connected) {
            syncStatusBadge.innerText = '已同步';
            syncStatusBadge.style.background = '#b85c7a';
        } else {
            syncStatusBadge.innerText = '同步中';
            syncStatusBadge.style.background = '#e6a017';
        }
    }

    // 获取当前分区的词条数组
    function getCurrentCategoryEntries() {
        return categoriesData[currentCategory] || [];
    }

    // 获取分区名称
    function getCategoryDisplayName(catId) {
        const names = {
            costume: '🎭 扮成……',
            action: '✨ 这样做……',
            place: '📍 在这里……'
        };
        return names[catId] || '未知分区';
    }

    // 更新分区显示文字
    function updateCategoryDisplay() {
        currentCatDisplay.innerText = `现在小母狗和主人更想：${getCategoryDisplayName(currentCategory)}`;
    }

    // 统计总数和当前分区数量
    function updateBadgeCount() {
        const currentCount = getCurrentCategoryEntries().length;
        const totalCount = categoriesData.costume.length + categoriesData.action.length + categoriesData.place.length;
        entriesCountSpan.innerText = `${currentCount} 项 / 共 ${totalCount} 项`;
    }

    // ========== 后端API交互 ==========
    
    // 从服务器获取数据（适配三分区结构）
    async function fetchEntriesFromServer() {
        try {
            updateSyncStatus(false);
            const response = await fetch(`${API_BASE}/api/entries`);
            if (!response.ok) throw new Error('获取失败');
            const data = await response.json();
            
            // 新数据结构：data.categories
            if (data.categories) {
                categoriesData = {
                    costume: data.categories.costume || [],
                    action: data.categories.action || [],
                    place: data.categories.place || []
                };
            }
            currentVersion = data.version || 0;
            
            renderEntriesListWithPrivacy();
            updateBadgeCount();
            updateSyncStatus(true);
            return true;
        } catch (error) {
            console.error('同步失败:', error);
            updateSyncStatus(false);
            return false;
        }
    }

    // 检查轮询更新
    async function checkForUpdates() {
        try {
            const response = await fetch(`${API_BASE}/api/entries`);
            if (!response.ok) return;
            const data = await response.json();
            if (data.version !== currentVersion) {
                if (data.categories) {
                    categoriesData = {
                        costume: data.categories.costume || [],
                        action: data.categories.action || [],
                        place: data.categories.place || []
                    };
                }
                currentVersion = data.version;
                renderEntriesListWithPrivacy();
                updateBadgeCount();
                console.log('检测到远程更新，已自动同步');
            }
        } catch (error) {
            console.error('检查更新失败:', error);
        }
    }

    // 添加词条（带分区）
    async function addEntryToServer(text, category) {
        try {
            const response = await fetch(`${API_BASE}/api/entries`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, category })
            });
            if (!response.ok) throw new Error('添加失败');
            await fetchEntriesFromServer();
            newEntryInput.value = '';
            return true;
        } catch (error) {
            alert('添加失败: ' + error.message);
            return false;
        }
    }

    // 编辑词条（可选跨分区修改）
    async function editEntryOnServer(id, newText, newCategory = null) {
        try {
            const body = newCategory ? { text: newText, category: newCategory } : { text: newText };
            const response = await fetch(`${API_BASE}/api/entries/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!response.ok) throw new Error('编辑失败');
            await fetchEntriesFromServer();
            return true;
        } catch (error) {
            alert('编辑失败: ' + error.message);
            return false;
        }
    }

    // 删除词条
    async function deleteEntryOnServer(id) {
        try {
            const response = await fetch(`${API_BASE}/api/entries/${id}`, {
                method: 'DELETE'
            });
            if (!response.ok) throw new Error('删除失败');
            await fetchEntriesFromServer();
            return true;
        } catch (error) {
            alert('删除失败: ' + error.message);
            return false;
        }
    }

    // 随机抽取（根据当前分区）
    function performRandomDraw() {
        const currentEntries = getCurrentCategoryEntries();
        if (!currentEntries.length) {
            resultDisplayEl.innerText = '💖 这个奖池还是空的，先增添奖励叭';
            return;
        }
        const randomIndex = Math.floor(Math.random() * currentEntries.length);
        const selected = currentEntries[randomIndex].text;
        resultDisplayEl.innerText = selected;
        resultDisplayEl.style.animation = 'none';
        void resultDisplayEl.offsetWidth;
        resultDisplayEl.style.animation = 'gentlePop 0.2s ease-out';
    }

    // 渲染列表（根据解锁状态和当前分区）
    function renderEntriesListWithPrivacy() {
        if (!entriesListContainer) return;
        
        const currentEntries = getCurrentCategoryEntries();
        
        if (!isUnlocked) {
            entriesListContainer.innerHTML = `<div class="empty-message">🔒 奖励列表已隐藏，点击【查看全部奖励】并输入密码可见详情与管理</div>`;
            entriesListContainer.classList.add('blur-content');
            return;
        }
        
        entriesListContainer.classList.remove('blur-content');
        
        if (currentEntries.length === 0) {
            entriesListContainer.innerHTML = `<div class="empty-message">✨ 当前分区还没有奖励，添加上方专属奖励吧~</div>`;
            return;
        }
        
        const container = document.createElement('div');
        currentEntries.forEach((entry) => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'list-item';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'item-text';
            textSpan.innerText = entry.text;
            
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'item-actions';
            
            const editBtn = document.createElement('button');
            editBtn.innerText = '✏️';
            editBtn.className = 'edit-btn';
            editBtn.onclick = async () => {
                if (!isUnlocked) { alert('请先解锁查看奖励'); return; }
                const newValue = prompt('编辑词条内容:', entry.text);
                if (newValue && newValue.trim()) {
                    const changeCat = confirm('是否要移动该词条到其他分区？\n确定=选择新分区，取消=仅修改文字');
                    if (changeCat) {
                        const newCat = prompt('选择新分区 (输入: costume/action/place)\ncostume=扮成, action=这样做, place=在这里', currentCategory);
                        if (newCat && ['costume', 'action', 'place'].includes(newCat)) {
                            await editEntryOnServer(entry.id, newValue.trim(), newCat);
                        } else {
                            await editEntryOnServer(entry.id, newValue.trim());
                        }
                    } else {
                        await editEntryOnServer(entry.id, newValue.trim());
                    }
                }
            };
            
            const delBtn = document.createElement('button');
            delBtn.innerText = '🗑️';
            delBtn.className = 'del-btn';
            if (!isUnlocked) {
                delBtn.classList.add('disabled-delete');
                delBtn.style.pointerEvents = 'none';
                delBtn.style.opacity = '0.4';
            } else {
                delBtn.onclick = async () => {
                    if (!isUnlocked) { alert('请先解锁查看奖励'); return; }
                    if (confirm(`确定永久移除“${entry.text}”吗？`)) {
                        await deleteEntryOnServer(entry.id);
                    }
                };
            }
            
            actionsDiv.appendChild(editBtn);
            actionsDiv.appendChild(delBtn);
            itemDiv.appendChild(textSpan);
            itemDiv.appendChild(actionsDiv);
            container.appendChild(itemDiv);
        });
        
        entriesListContainer.innerHTML = '';
        entriesListContainer.appendChild(container);
    }

    // 切换分区
    function switchCategory(categoryId) {
        currentCategory = categoryId;
        
        // 更新按钮样式
        document.querySelectorAll('.cat-btn').forEach(btn => {
            if (btn.dataset.cat === categoryId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        updateCategoryDisplay();
        renderEntriesListWithPrivacy();
        updateBadgeCount();
    }

    // 添加词条的处理函数
    async function handleAddEntry() {
        const text = newEntryInput.value.trim();
        const category = categorySelect.value;
        if (!text) {
            alert('请输入奖励内容~');
            return;
        }
        await addEntryToServer(text, category);
    }

    // 密码解锁
    function attemptUnlock() {
        if (isUnlocked) {
            alert('已经解锁啦，所有的奖励都可以被你看到 ❤️');
            return;
        }
        const pwd = prompt("🔐 这是Daddy的秘密哦，请输入查看密码:");
        if (pwd === "0331") {
            isUnlocked = true;
            renderEntriesListWithPrivacy();
            alert("解锁成功！现在你可以查看所有奖励并进行删除管理~");
        } else if (pwd !== null) {
            alert("密码错误，无法查看词条列表，只能继续增加词条。");
        }
    }

    // 轮询启动
    function startPolling() {
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = setInterval(checkForUpdates, 3000);
    }

    // 绑定分区切换事件
    function bindCategoryEvents() {
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchCategory(btn.dataset.cat);
            });
        });
    }

    // 绑定其他UI事件
    function bindEvents() {
        drawBtn.addEventListener('click', performRandomDraw);
        addEntryBtn.addEventListener('click', handleAddEntry);
        newEntryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleAddEntry();
        });
        manualSyncBtn.addEventListener('click', async () => {
            await fetchEntriesFromServer();
            alert('已强制同步最新奖池');
        });
        viewRewardsBtn.addEventListener('click', attemptUnlock);
    }

    // 初始化
    async function init() {
        await fetchEntriesFromServer();
        startPolling();
        bindCategoryEvents();
        bindEvents();
        isUnlocked = false;
        switchCategory('costume');  // 默认显示第一个分区
        if (categoriesData.costume.length > 0 || categoriesData.action.length > 0 || categoriesData.place.length > 0) {
            resultDisplayEl.innerText = '❤ 要怎么做呢';
        } else {
            resultDisplayEl.innerText = '❤ 要怎么做呢';
        }
    }
    
    init();
</script>
</body>
</html>
